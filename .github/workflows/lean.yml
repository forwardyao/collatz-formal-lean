name: lean-build

# 一键类型检查 + 回执自动回写。
# 触发：push 或手动（Actions 页 → Run workflow）
# 设计要点：
#   1) build / test 都 continue-on-error，某一步失败不中断其余检查，
#      一次运行即得完整回执（版本、build、test、sorry 四份）。
#   2) 结束时把全部回执写入仓库 .ci/last-status.md，外部可直接读取，无需人工转发日志。
#   3) 最后一步「判定」按真实退出码定结论：任一检查非 0 则本次运行标红。
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz -o elan.tar.gz
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: 版本锚点
        run: |
          lake --version | tee version.txt
          lean --version | tee -a version.txt

      - name: 类型检查（定理体）
        continue-on-error: true
        run: |
          set +e
          lake build > build.log 2>&1
          echo "exit=$?" > build.exit
          tail -40 build.log

      - name: 可执行自检（预期 3 条 ok + 1 条梅森表）
        continue-on-error: true
        run: |
          set +e
          lake env lean Collatz/Test.lean > test.log 2>&1
          echo "exit=$?" > test.exit
          tail -20 test.log

      - name: 登记真实 sorry（整行精确匹配，排除注释）
        if: always()
        run: |
          grep -rnE '^[[:space:]]*sorry[[:space:]]*$' Collatz/ > sorry_list.txt || true
          echo "计数=$(wc -l < sorry_list.txt)"
          cat sorry_list.txt
          echo "提醒：sorry 是 warning 不是 error，build 通过不等于证明完成。"

      - name: 回写回执到仓库（.ci/last-status.md）
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .ci
          {
            echo "# lean-build 回执（自动回写）"
            echo ""
            echo "- commit: $GITHUB_SHA"
            echo "- run_id: $GITHUB_RUN_ID"
            echo ""
            echo "## 版本锚点"
            echo '```'
            cat version.txt 2>/dev/null || echo "(未取)"
            echo '```'
            echo "## 退出码"
            echo '```'
            cat build.exit 2>/dev/null || echo "build: (未取)"
            cat test.exit 2>/dev/null || echo "test: (未取)"
            echo '```'
            echo "## build.log 中的 error 行（最多 40 条）"
            echo '```'
            grep -n "error" build.log 2>/dev/null | head -40 || echo "(无 error 行)"
            echo '```'
            echo "## build.log 尾部 60 行"
            echo '```'
            tail -60 build.log 2>/dev/null || echo "(未取)"
            echo '```'
            echo "## test.log 尾部 30 行"
            echo '```'
            tail -30 test.log 2>/dev/null || echo "(未取)"
            echo '```'
            echo "## sorry 清单（应 7 处）"
            echo '```'
            cat sorry_list.txt 2>/dev/null || echo "(未取)"
            echo '```'
          } > .ci/last-status.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/last-status.md
          B=1
          if grep -q "exit=0" build.exit 2>/dev/null; then B=0; fi
          T=1
          if grep -q "exit=0" test.exit 2>/dev/null; then T=0; fi
          S=0
          if [ -f sorry_list.txt ]; then S=$(wc -l < sorry_list.txt); fi
          E=$(grep -oE '[A-Za-z0-9_/]+\.lean:[0-9]+:[0-9]+' build.log 2>/dev/null | head -1 || true)
          if [ -z "$E" ]; then E=none; fi
          echo "RECEIPT build=$B test=$T sorry=$S first=$E" | tee receipt.txt
          if git diff --cached --quiet; then
            echo "回执无变化，不提交"
          else
            git commit -m "ci: RECEIPT build=$B test=$T sorry=$S first=$E [skip ci]"
            git push
          fi

      - name: 上传回执
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-receipt
          path: |
            version.txt
            build.log
            test.log
            sorry_list.txt

      - name: 判定
        if: always()
        run: |
          ok=1
          grep -q "exit=0" build.exit 2>/dev/null || ok=0
          grep -q "exit=0" test.exit 2>/dev/null || ok=0
          echo "build 与 test 均通过: $ok"
          if [ "$ok" = "0" ]; then
            echo "结论：未通过。详见 .ci/last-status.md 或本次运行的 lean-receipt artifact。"
            exit 1
          fi
