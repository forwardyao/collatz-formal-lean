name: lean-build

# 一键类型检查 + 回执自动回写。
# 触发：push 或手动（Actions 页 → Run workflow）
# 设计要点：
#   1) build / test 都 continue-on-error，某一步失败不中断其余检查，
#      一次运行即得完整回执（版本、olean、build、test、sorry）。
#   2) 结束时把全部回执写入仓库 .ci/last-status.md，把四份原始回执逐份落到
#      .ci/receipt/（C3 起，供无 artifact 接口时取原文），并把结论压成一行
#      写进提交信息，外部无需打开日志即可判定。
#   3) 末步按真实退出码定结论：任一检查非 0 则本次运行标红。
#   4) 回执行附 ver=（lean 工具链实际版本），供固定 lean-toolchain 使用。
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz -o elan.tar.gz
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: 版本锚点
        run: |
          lake --version | tee version.txt
          lean --version | tee -a version.txt

      - name: 类型检查（定理体）
        continue-on-error: true
        run: |
          set +e
          lake build > build.log 2>&1
          echo "exit=$?" > build.exit
          tail -40 build.log

      - name: 产物诊断（olean 是否齐全）
        if: always()
        run: |
          set +e
          find .lake/build/lib/lean -name '*.olean' 2>/dev/null | sort > oleans.txt
          if [ -f oleans.txt ]; then
            echo "olean 计数=$(wc -l < oleans.txt)"
            cat oleans.txt
          else
            echo "olean 计数=0（目录未生成）"
            : > oleans.txt
          fi

      - name: 可执行自检（预期 3 条 ok + 1 条梅森表）
        continue-on-error: true
        run: |
          set +e
          lake env lean Collatz/Test.lean > test.log 2>&1
          echo "exit=$?" > test.exit
          tail -30 test.log

      - name: 登记真实 sorry（整行精确匹配，排除注释）
        if: always()
        run: |
          set +e
          grep -rnE '^[[:space:]]*sorry[[:space:]]*$' Collatz/ > sorry_list.txt 2>/dev/null
          echo "计数=$(wc -l < sorry_list.txt 2>/dev/null)"
          cat sorry_list.txt 2>/dev/null
          echo "提醒：sorry 是 warning 不是 error，build 通过不等于证明完成。"

      - name: 汇总回执（写 .ci/last-status.md 并把结论写进提交信息）
        if: always()
        continue-on-error: true
        run: |
          set +e
          mkdir -p .ci
          {
            echo "# lean-build 回执（自动回写）"
            echo ""
            echo "- commit: $GITHUB_SHA"
            echo "- run_id: $GITHUB_RUN_ID"
            echo ""
            echo "## 版本锚点"
            echo '~~~'
            cat version.txt 2>/dev/null || echo "(未取)"
            echo '~~~'
            echo "## 退出码（0 为通过）"
            echo '~~~'
            cat build.exit 2>/dev/null || echo "build: (未取)"
            cat test.exit 2>/dev/null || echo "test: (未取)"
            echo '~~~'
            echo "## olean 产物清单"
            echo '~~~'
            cat oleans.txt 2>/dev/null || echo "(未取)"
            echo '~~~'
            echo "## build.log 中的 error 行（最多 30 条）"
            echo '~~~'
            grep -n "error" build.log 2>/dev/null | head -30 || echo "(无 error 行)"
            echo '~~~'
            echo "## build.log 尾部 40 行"
            echo '~~~'
            tail -40 build.log 2>/dev/null || echo "(未取)"
            echo '~~~'
            echo "## test.log 中的 error 行（最多 30 条）"
            echo '~~~'
            grep -n "error" test.log 2>/dev/null | head -30 || echo "(无 error 行)"
            echo '~~~'
            echo "## test.log 尾部 60 行"
            echo '~~~'
            tail -60 test.log 2>/dev/null || echo "(未取)"
            echo '~~~'
            echo "## sorry 清单（应 7 处）"
            echo '~~~'
            cat sorry_list.txt 2>/dev/null || echo "(未取)"
            echo '~~~'
          } > .ci/last-status.md

          B=1
          if grep -q "exit=0" build.exit 2>/dev/null; then B=0; fi
          T=1
          if grep -q "exit=0" test.exit 2>/dev/null; then T=0; fi
          S=0
          if [ -f sorry_list.txt ]; then S=$(wc -l < sorry_list.txt); fi
          E=none
          if [ "$T" = "1" ]; then
            E=$(grep -m3 "error" test.log 2>/dev/null | paste -sd' ' - | tr -d '"' | tr -d "'" | sed 's/[[:space:]][[:space:]]*/ /g' | cut -c1-140)
            if [ -z "$E" ]; then E="test失败但无error行"; fi
          fi
          V=$(sed -n 's/.*[Vv]ersion \([0-9][0-9.]*\).*/\1/p' version.txt 2>/dev/null | head -1)
          if [ -z "$V" ]; then V="未取"; fi
          echo "RECEIPT build=$B test=$T sorry=$S ver=$V err=$E" | tee receipt.txt

          # C3：四份回执文件化落地（超过 400KB 只留尾部，避免仓库膨胀）
          mkdir -p .ci/receipt
          for f in version.txt oleans.txt build.log build.exit test.log test.exit sorry_list.txt receipt.txt; do
            if [ -f "$f" ]; then
              if [ "$(wc -c < "$f")" -gt 409600 ]; then
                { echo "[CI] 原文件超过 400KB，仅保留尾部 1500 行"; tail -1500 "$f"; } > ".ci/receipt/$f"
              else
                cp "$f" ".ci/receipt/$f"
              fi
            else
              echo "(未取)" > ".ci/receipt/$f"
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ci/last-status.md .ci/receipt
          if git diff --cached --quiet; then
            echo "回执无变化，不提交"
          else
            git commit -m "ci: RECEIPT build=$B test=$T sorry=$S ver=$V err=$E [skip ci]"
            git push
          fi

      - name: 上传回执
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-receipt
          path: |
            version.txt
            oleans.txt
            build.log
            build.exit
            test.log
            test.exit
            sorry_list.txt
            receipt.txt

      - name: 判定
        if: always()
        run: |
          ok=1
          grep -q "exit=0" build.exit 2>/dev/null || ok=0
          grep -q "exit=0" test.exit 2>/dev/null || ok=0
          echo "build 与 test 均通过: $ok"
          if [ "$ok" = "0" ]; then
            echo "结论：未通过。详见 .ci/last-status.md 或本次运行的 lean-receipt artifact。"
            exit 1
          fi
